<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cat &amp; Frog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <canvas id="game" aria-label="Cat and Frog two-player game"></canvas>
  </main>
  <!-- Small controls card, pinned to the bottom-left corner over the game. -->
  <aside class="controls" aria-label="Controls">
    <p class="cat">🐱 <kbd>A</kbd><kbd>D</kbd> walk · <kbd>S</kbd> poop · <kbd>W</kbd> green poop</p>
    <p class="cat small">stink +1 · green stink +2 · green makes frog dizzy</p>
    <p class="frog">🐸 <kbd>←</kbd><kbd>→</kbd> hop · <kbd>↑</kbd> jump · <kbd>↓</kbd> tongue · <kbd>/</kbd> spit</p>
    <p class="frog small">grass +1 · air catch +2 · spit makes cat dizzy</p>
    <p class="small"><kbd>Space</kbd> start · <kbd>F</kbd> fullscreen</p>
    <p class="touch-note">This game needs a keyboard.</p>
  </aside>
  <script src="game.js"></script>
</body>
</html>
